name: Daily Quant Sentiment Pipeline

on:
  schedule:
    # 08:30 Beijing (CST = UTC+8), Mon-Fri -> 00:30 UTC
    # Pre-market briefing: reuse the last finalized close + settled margin.
    - cron: '30 0 * * 1-5'
    # 15:30 Beijing, Mon-Fri -> 07:30 UTC
    # Close settlement: full 5,500-stock cross-section, final daily point.
    - cron: '30 7 * * 1-5'
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/data/**'
      - 'docs/data.js'
      - 'README.md'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run offline unit tests
        env:
          PYTHONUTF8: "1"
        run: python -m unittest discover -s tests -v

      - name: Run quantitative pipeline
        env:
          PYTHONUTF8: "1"
          TZ: Asia/Shanghai
        run: |
          MODE="auto"
          if [ "${{ github.event.schedule }}" = "30 0 * * 1-5" ]; then MODE="morning"; fi
          if [ "${{ github.event.schedule }}" = "30 7 * * 1-5" ]; then MODE="close"; fi
          echo "Pipeline mode: ${MODE}"
          python run_pipeline.py --mode "${MODE}"

      - name: Commit updated quant data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: quant 2.1 data update [skip ci]"
          file_pattern: "docs/data/* docs/data.js"
          skip_dirty_check: false

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
